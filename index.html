<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101018">
<title>MMR Tracker — MLBB</title>
<style>
:root{color-scheme:dark;--bg:#0d0d14;--panel:#171722;--panel2:#20202d;--line:#2b2b3b;--muted:#9696aa;--text:#f5f5fb;--purple:#9b87ff;--green:#5cdaa0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#30245b 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:28px 20px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#b19aff,#6d52d9);display:grid;place-items:center;font-size:23px}.brand h1{font-size:19px;margin:0}.brand p{margin:0;color:var(--muted);font-size:12px}.hero{padding:25px;border:1px solid #39314f;border-radius:20px;background:linear-gradient(120deg,#211b37,#171722 70%);margin-bottom:18px}.eyebrow{color:#b6a8ff;text-transform:uppercase;font-size:11px;letter-spacing:1.5px;font-weight:700}.hero h2{font-size:clamp(25px,5vw,36px);margin:5px 0}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 26px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:4px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}.section-head h3{font-size:18px;margin:0}.primary,.secondary{border:0;border-radius:12px;padding:11px 16px;font-weight:700}.primary{background:var(--purple);color:#171126}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;min-width:0}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.hero-name{font-size:17px;font-weight:750}.sub{font-size:12px;color:var(--muted)}.dots{border:0;background:transparent;color:var(--muted);font-size:20px;padding:0 4px}.numbers{display:flex;justify-content:space-between;align-items:end;margin:16px 0 10px}.numbers strong{font-size:25px;letter-spacing:-.8px}.numbers span{color:var(--muted);font-size:11px;display:block}.progress{height:8px;background:#30303e;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#8068ed,#b09aff);border-radius:99px}.progress-line{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px}.progress-line b{color:var(--green)}.remaining{color:var(--muted)}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;padding:9px 8px;font-size:12px}.empty{padding:38px 20px;text-align:center;border:1px dashed #3b3b4e;border-radius:18px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:5}.modal.show{display:grid}.dialog{width:min(100%,420px);background:#191923;border:1px solid var(--line);border-radius:20px;padding:22px}.dialog h3{margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input{width:100%;background:#101019;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);outline:none}.field input:focus{border-color:var(--purple)}.dialog-actions{display:flex;gap:9px;margin-top:18px}.dialog-actions button{flex:1}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#252536;border:1px solid var(--line);padding:10px 16px;border-radius:99px;display:none;z-index:8}.toast.show{display:block}
@media(max-width:560px){.wrap{padding:20px 14px 45px}.hero{padding:21px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:20px}.section-head{align-items:flex-end}.primary{padding:10px 12px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>MMR Tracker</h1><p>Mobile Legends</p></div></div></header>
<section class="hero"><div class="eyebrow">MLBB MMR</div><h2>Track your hero MMR.</h2><p>Set a target for each hero and keep track of your progress.</p></section>
<section class="stats"><div class="stat"><span>Tracked heroes</span><strong id="count">0</strong></div><div class="stat"><span>Combined current MMR</span><strong id="total">0</strong></div><div class="stat"><span>Targets completed</span><strong id="completed">0</strong></div></section>
<div class="section-head"><h3>Your heroes</h3><button class="primary" id="addBtn">＋ Add hero</button></div>
<section class="grid" id="heroes"></section>
</main>
<div class="modal" id="modal"><form class="dialog" id="heroForm"><h3 id="modalTitle">Add a hero</h3><input type="hidden" id="editId"><div class="field"><label for="name">Hero name</label><input id="name" maxlength="35" placeholder="e.g. Nolan" required></div><div class="field"><label for="current">Current MMR</label><input id="current" type="number" min="0" step="1" placeholder="e.g. 2450" required></div><div class="field"><label for="target">Target MMR</label><input id="target" type="number" min="1" step="1" placeholder="e.g. 3000" required></div><div class="dialog-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" type="submit">Save hero</button></div></form></div>
<div class="modal" id="matchModal"><form class="dialog" id="matchForm"><h3>Update MMR</h3><input type="hidden" id="matchId"><div class="field"><label for="delta">MMR gained or lost</label><input id="delta" type="number" step="1" placeholder="e.g. 25 or -12" required></div><div class="dialog-actions"><button type="button" class="secondary" id="matchCancel">Cancel</button><button class="primary">Apply change</button></div></form></div>
<div class="toast" id="toast"></div>
<script>
const KEY='mlbb-mmr-tracker-v1';let heroes=[];try{heroes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(heroes))heroes=[]}catch(e){heroes=[]}
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString(),save=()=>localStorage.setItem(KEY,JSON.stringify(heroes));
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const root=$('heroes');$('count').textContent=heroes.length;$('total').textContent=fmt(heroes.reduce((a,h)=>a+(Number(h.current)||0),0));$('completed').textContent=heroes.filter(h=>Number(h.current)>=Number(h.target)).length;if(!heroes.length){root.innerHTML='<div class="empty" style="grid-column:1/-1"><b>No heroes yet</b>Add a hero to start tracking MMR.</div>';return}root.innerHTML=heroes.map(h=>{const current=Number(h.current)||0,target=Number(h.target)||1,pct=Math.max(0,Math.min(100,current/target*100)),left=Math.max(0,target-current);return '<article class="hero-card"><div class="hero-top"><div><div class="hero-name">'+esc(h.name)+'</div><div class="sub">'+(current>=target?'✦ Target reached':'MMR progress')+'</div></div><button class="dots" data-delete="'+h.id+'" aria-label="Delete '+esc(h.name)+'">•••</button></div><div class="numbers"><div><span>CURRENT MMR</span><strong>'+fmt(current)+'</strong></div><div style="text-align:right"><span>TARGET MMR</span><strong>'+fmt(target)+'</strong></div></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div class="progress-line"><b>'+pct.toFixed(1)+'% complete</b><span class="remaining">'+(left?fmt(left)+' MMR to go':'Goal achieved!')+'</span></div><div class="actions"><button class="secondary" data-match="'+h.id+'">＋ / − Update MMR</button><button class="secondary" data-edit="'+h.id+'">Edit</button></div></article>'}).join('')}
function openHero(h){$('heroForm').reset();$('editId').value=h?.id||'';$('modalTitle').textContent=h?'Edit hero':'Add a hero';if(h){$('name').value=h.name;$('current').value=h.current;$('target').value=h.target}$('modal').classList.add('show')}
$('addBtn').onclick=()=>openHero();$('cancel').onclick=()=>$('modal').classList.remove('show');$('matchCancel').onclick=()=>$('matchModal').classList.remove('show');
$('heroForm').onsubmit=e=>{e.preventDefault();const id=$('editId').value,name=$('name').value.trim(),current=Math.max(0,Math.floor(Number($('current').value))),target=Math.max(1,Math.floor(Number($('target').value)));if(!name||!Number.isFinite(current)||!Number.isFinite(target))return;if(id){const h=heroes.find(x=>x.id===id);if(h)Object.assign(h,{name,current,target})}else heroes.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,current,target});save();render();$('modal').classList.remove('show');toast('MMR saved!')};
$('heroes').onclick=e=>{const del=e.target.closest('[data-delete]'),edit=e.target.closest('[data-edit]'),match=e.target.closest('[data-match]');if(del){const h=heroes.find(x=>x.id===del.dataset.delete);if(h&&confirm('Delete '+h.name+' from your MMR tracker?')){heroes=heroes.filter(x=>x.id!==h.id);save();render();toast('Hero removed')}}else if(edit){const h=heroes.find(x=>x.id===edit.dataset.edit);if(h)openHero(h)}else if(match){$('matchId').value=match.dataset.match;$('delta').value='';$('matchModal').classList.add('show')}};
$('matchForm').onsubmit=e=>{e.preventDefault();const h=heroes.find(x=>x.id===$('matchId').value),delta=Number($('delta').value);if(!h||!Number.isFinite(delta))return;h.current=Math.max(0,(Number(h.current)||0)+Math.trunc(delta));save();render();$('matchModal').classList.remove('show');toast((delta>=0?'+':'')+Math.trunc(delta)+' MMR applied')};
render();
</script>
</body>
</html>
